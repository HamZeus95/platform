# A self-signed root CA, then a ClusterIssuer that signs from it. This gives
# real (if privately-trusted) certs for LAN hostnames without any public DNS
# or inbound ports. Import ca.crt on a client once to remove browser warnings:
#   kubectl --context prod get secret homelab-ca-root -n cert-manager \
#     -o jsonpath='{.data.tls\.crt}' | base64 -d > homelab-ca.crt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca-root
  duration: 87600h    # 10y
  renewBefore: 8760h  # 1y
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-ca-root
