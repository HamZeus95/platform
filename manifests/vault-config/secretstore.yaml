# ESO authenticates to Vault with its own Kubernetes ServiceAccount token.
# Vault validates that token against the cluster's API and issues a short-lived
# Vault token carrying only the eso-read policy - so no long-lived Vault
# credential is ever stored in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
