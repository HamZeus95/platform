# Proves the whole path: a value written in Vault appears as a native
# Kubernetes Secret, refreshed on an interval, with nothing secret in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-app-demo
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: auth-app-demo
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: auth-app/demo
        property: message
    - secretKey: owner
      remoteRef:
        key: auth-app/demo
        property: owner
