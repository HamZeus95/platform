apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - alerts.yaml
# The dashboard stays a readable .json file in git rather than a wall of
# escaped JSON inside a ConfigMap. The Grafana sidecar discovers any ConfigMap
# labelled grafana_dashboard="1" in any namespace.
configMapGenerator:
  - name: grafana-dashboard-auth-app-red
    files:
      - auth-app-red.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
