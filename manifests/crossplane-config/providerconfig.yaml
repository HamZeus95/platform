# InjectedIdentity: the provider acts as its own ServiceAccount against the
# cluster it runs in, so there is no kubeconfig to store anywhere.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: InjectedIdentity
---
# The provider's SA gets no workload permissions by default. Its name carries a
# hash that changes when the provider is upgraded, so bind by group rather than
# by name - otherwise the binding silently stops applying after an upgrade and
# every claim fails with a Forbidden that looks like a Composition bug.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-kubernetes-workloads
rules:
  - apiGroups: [""]
    resources: [services, secrets, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-kubernetes-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-kubernetes-workloads
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:crossplane-system
