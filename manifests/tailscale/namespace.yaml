apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # The operator spawns proxy pods running tailscaled, which need NET_ADMIN.
    # Talos enforces PodSecurity "baseline" cluster-wide and baseline permits
    # only NET_BIND_SERVICE, so those pods are rejected without this.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
