apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-app
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts: [auth.lab]
      secretName: auth-app-tls
  rules:
    - host: auth.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-app
                port: { number: 80 }
