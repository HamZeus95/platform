apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base
  - ingress.yaml
  - ingress-tailscale.yaml
  - seed-job.yaml
  - servicemonitor.yaml
patches:
  - target: { kind: Deployment, name: auth-app }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLIENT_URL
          value: https://auth-app.tailf46ba0.ts.net
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring.svc.cluster.local:4318

# Single source of truth for the image tag. CI rewrites newTag here, and the
# transformer applies it to every container using this image name - the
# Deployment and the seed hook - so they can never drift apart.
images:
  - name: ghcr.io/hamzeus95/auth-app
    newTag: 7ee6b3e802e29bc13d653766da103affc99066fb
