apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base
patches:
  # dev is reached through the k3d loadbalancer port mapping, not an ingress
  - target: { kind: Deployment, name: auth-app }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLIENT_URL
          value: http://localhost:8088

# Single source of truth for the image tag. CI rewrites newTag here, and the
# transformer applies it to every container using this image name - the
# Deployment and the seed hook - so they can never drift apart.
images:
  - name: ghcr.io/hamzeus95/auth-app
    newTag: 5e15c3d17ed00112c5a2d2896f1d5b9fe422dd1c
