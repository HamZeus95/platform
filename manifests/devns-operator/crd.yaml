---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: developernamespaces.platform.homelab.io
spec:
  group: platform.homelab.io
  names:
    kind: DeveloperNamespace
    listKind: DeveloperNamespaceList
    plural: developernamespaces
    shortNames:
    - devns
    singular: developernamespace
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.team
      name: Team
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DeveloperNamespace is a self-service namespace request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeveloperNamespaceSpec describes a self-service namespace for a team.

              The point of the CRD is that a developer asks for "a namespace for my team,
              medium size" and receives a namespace, a quota, default container limits and
              RBAC bound to their identity-provider group - rather than filing a ticket, or
              copy-pasting four manifests and forgetting the quota.
            properties:
              namespaceName:
                description: NamespaceName to create. Defaults to "team-<Team>" when
                  empty.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              oidcGroup:
                description: |-
                  OIDCGroup is the identity-provider group granted access. It is bound to
                  the chosen Role with a RoleBinding, so membership is managed in Keycloak
                  rather than by editing RBAC per person.
                type: string
              role:
                default: edit
                description: Role granted to OIDCGroup inside the namespace.
                enum:
                - view
                - edit
                - admin
                type: string
              size:
                default: small
                description: |-
                  Size is a t-shirt size rather than raw quantities, so the platform can
                  retune what "small" means centrally without every team editing YAML.
                enum:
                - small
                - medium
                - large
                type: string
              team:
                description: |-
                  Team owning the namespace. Recorded as a label on every resource the
                  controller creates, so ownership is still discoverable from the cluster
                  even if this object is lost.
                maxLength: 40
                minLength: 2
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - team
            type: object
          status:
            description: DeveloperNamespaceStatus reports what was actually created.
            properties:
              appliedQuota:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  AppliedQuota echoes the quota that Size resolved to, so a developer can
                  see what "small" bought them without reading the operator's source.
                type: object
              conditions:
                description: |-
                  Conditions follows the standard Kubernetes convention; Ready summarises
                  whether every child resource is in place.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                description: |-
                  Namespace actually created, which may differ from the request when
                  NamespaceName was left empty.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status reflects.
                  Without it, a stale Ready=True is indistinguishable from a current one.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
