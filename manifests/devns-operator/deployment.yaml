apiVersion: apps/v1
kind: Deployment
metadata:
  name: devns-operator
  namespace: devns-operator
  labels: { control-plane: controller-manager }
spec:
  replicas: 1
  selector:
    matchLabels: { control-plane: controller-manager }
  template:
    metadata:
      labels: { control-plane: controller-manager }
    spec:
      serviceAccountName: devns-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: ghcr.io/hamzeus95/devns-operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8081, name: health }]
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
