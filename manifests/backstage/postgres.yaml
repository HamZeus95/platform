apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: backstage-db-data, namespace: backstage }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backstage-db, namespace: backstage }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: backstage-db } }
  template:
    metadata: { labels: { app: backstage-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: backstage }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "backstage", "-d", "backstage"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backstage-db-data }
---
apiVersion: v1
kind: Service
metadata: { name: backstage-db, namespace: backstage }
spec:
  selector: { app: backstage-db }
  ports: [{ port: 5432, targetPort: 5432 }]
