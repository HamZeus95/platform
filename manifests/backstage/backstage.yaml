apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels: { app: backstage }
spec:
  replicas: 1
  selector: { matchLabels: { app: backstage } }
  template:
    metadata: { labels: { app: backstage } }
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          image: ghcr.io/hamzeus95/backstage:latest
          imagePullPolicy: Always
          # No args override: the image's CMD is already
          #   node packages/backend --config app-config.yaml --config app-config.production.yaml
          # and the node base image's entrypoint re-execs whatever it is given,
          # so overriding args produced "node: bad option: --config".
          env:
            - { name: POSTGRES_HOST, value: backstage-db }
            - { name: POSTGRES_PORT, value: "5432" }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: POSTGRES_PASSWORD } }
            # Signs tokens between backend plugins; Backstage will not start in
            # production without it.
            - name: BACKEND_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: BACKEND_SECRET } }
            - name: KUBERNETES_SA_TOKEN
              valueFrom: { secretKeyRef: { name: backstage-sa-token, key: token } }
          ports: [{ containerPort: 7007, name: http }]
          readinessProbe:
            httpGet: { path: /healthcheck, port: 7007 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthcheck, port: 7007 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels: { app: backstage }
spec:
  selector: { app: backstage }
  ports: [{ name: http, port: 80, targetPort: 7007 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: backstage
      port: { number: 80 }
  tls:
    - hosts: [backstage]
