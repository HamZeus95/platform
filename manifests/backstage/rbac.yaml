apiVersion: v1
kind: ServiceAccount
metadata: { name: backstage, namespace: backstage }
---
# Read-only: the Kubernetes plugin shows a component's workloads in the portal,
# so it needs to see them and nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: backstage-read }
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, limitranges, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: backstage-read }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
---
# Kubernetes 1.24+ stopped auto-creating ServiceAccount token Secrets, and the
# Backstage config needs the token as an env var rather than a mounted file,
# so this one is requested explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-sa-token
  namespace: backstage
  annotations:
    kubernetes.io/service-account.name: backstage
type: kubernetes.io/service-account-token
