apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 90.0.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # --- Talos: the control plane binds its metrics to 127.0.0.1, so these
        # ServiceMonitors would scrape nothing and sit permanently DOWN, which
        # is worse than not collecting them. Re-enabled once the machine config
        # sets bind-address=0.0.0.0 for these components.
        kubeControllerManager: { enabled: false }
        kubeScheduler:         { enabled: false }
        kubeProxy:             { enabled: false }
        kubeEtcd:              { enabled: false }

        prometheus:
          prometheusSpec:
            # local-path provisions hostPath PVs, and Kubernetes does not apply
            # fsGroup ownership to hostPath volumes. The kubelet then creates
            # the prometheus-db subPath dir as root:root 0755, so Prometheus
            # (uid 1000) cannot write and dies with:
            #   open /prometheus/queries.active: permission denied
            # Same remedy the Grafana chart ships as init-chown-data.
            initContainers:
              - name: init-chown-data
                image: busybox:1.36
                command: ["sh", "-c", "mkdir -p /prometheus && chown -R 1000:2000 /prometheus"]
                securityContext:
                  runAsUser: 0
                  runAsNonRoot: false
                volumeMounts:
                  - name: prometheus-kube-prometheus-stack-prometheus-db
                    mountPath: /prometheus
                    subPath: prometheus-db
            retention: 15d
            # Without this, ServiceMonitors created outside the chart's release
            # (ours) are ignored and nothing custom is ever scraped.
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits:   { memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 10Gi } }

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 2Gi } }

        grafana:
          # Recreate, not the chart's default RollingUpdate. Grafana keeps its
          # state in SQLite on an RWO local-path volume; local-path is
          # node-local so both the old and new pod schedule onto the same node
          # and BOTH mount it, producing "database is locked (SQLITE_BUSY)" and
          # a stuck rollout. Same failure mode as Postgres in phase 0.
          deploymentStrategy:
            type: Recreate
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          # Reachable from any tailnet device with a Tailscale-issued cert.
          ingress:
            enabled: true
            ingressClassName: tailscale
            hosts: []
            tls:
              - hosts: [grafana]
          # Client secret arrives as an env var, which Grafana prefers over
          # grafana.ini, so it never appears in the rendered config.
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client_secret
          grafana.ini:
            server:
              root_url: https://grafana.tailf46ba0.ts.net
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              # NOT "groups": that would request a client scope of that name,
              # which does not exist, and Keycloak fails the whole flow with
              # invalid_scope. The groups claim comes from a protocol mapper on
              # the client's dedicated scope, which is always applied.
              scopes: "openid profile email"
              auth_url: https://keycloak.tailf46ba0.ts.net/realms/homelab/protocol/openid-connect/auth
              token_url: https://keycloak.tailf46ba0.ts.net/realms/homelab/protocol/openid-connect/token
              api_url: https://keycloak.tailf46ba0.ts.net/realms/homelab/protocol/openid-connect/userinfo
              # Keycloak group -> Grafana role. Anyone who authenticates but is
              # in no group gets Viewer, never Admin.
              role_attribute_path: "contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'"
              role_attribute_strict: false
              allow_sign_up: true
              use_pkce: true
            auth:
              # Keeps the local admin login usable as a break-glass path if
              # Keycloak is down - locking yourself out of the dashboards
              # during an incident is a real failure mode.
              disable_login_form: false
          # Prometheus is wired up by the chart; Loki and Tempo are separate
          # releases so they have to be declared here.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                # Turns a trace_id in a log line into a clickable link
                # through to the trace in Tempo.
                derivedFields:
                  - name: TraceID
                    matcherRegex: 'trace_id["=:\s]+([a-f0-9]{32})'
                    datasourceUid: tempo
                    url: '$${__value.raw}'
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: -5m
                  spanEndTimeShift: 5m
                  filterByTraceID: true
                serviceMap:
                  datasourceUid: prometheus

        # node-exporter needs hostPath/hostPID/hostNetwork, hence the
        # privileged namespace label below.
        nodeExporter: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
      # the stack's CRDs (Prometheus, Alertmanager, ...) exceed the
      # last-applied-configuration annotation limit
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
