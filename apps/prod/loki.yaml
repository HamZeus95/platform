apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      releaseName: loki
      values: |
        # Single binary: one process, filesystem storage, no object store and
        # no memcached. Appropriate for a 3-node homelab; the SimpleScalable
        # default would want S3-compatible storage we do not have.
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # Loki 3.x ships no default schema; omitting this fails at startup.
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 168h   # 7d
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: local-path
            size: 10Gi
          # Same hostPath/fsGroup problem that broke Prometheus: local-path
          # provisions hostPath PVs and Kubernetes does not apply fsGroup to
          # them, so /var/loki stays root-owned and Loki (uid 10001) cannot
          # write. Pre-empted here rather than discovered in a crash loop.
          initContainers:
            - name: init-chown-data
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /var/loki && chown -R 10001:10001 /var/loki"]
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
              volumeMounts:
                - name: storage
                  mountPath: /var/loki
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }

        # Everything below belongs to the distributed/SSD topologies.
        backend:       { replicas: 0 }
        read:          { replicas: 0 }
        write:         { replicas: 0 }
        ingester:      { replicas: 0 }
        querier:       { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler:{ replicas: 0 }
        distributor:   { replicas: 0 }
        compactor:     { replicas: 0 }
        indexGateway:  { replicas: 0 }
        bloomPlanner:  { replicas: 0 }
        bloomBuilder:  { replicas: 0 }
        bloomGateway:  { replicas: 0 }

        chunksCache:  { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary:   { enabled: false }
        test:         { enabled: false }
        gateway:      { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
