apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HamZeus95/platform
    path: manifests/backstage
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
