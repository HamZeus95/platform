apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devns-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HamZeus95/platform
    path: manifests/devns-operator
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: devns-operator
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
